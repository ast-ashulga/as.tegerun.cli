[project]
name = "tegerun"
version = "0.2.0"
description = "Read-only Telegram triage CLI: fetch, classify, and notify on matching messages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "fast-mcp-telegram>=0.46,<0.47",
]

[project.scripts]
tege = "tegerun.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tegerun"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
# Pyflakes only: undefined names, unused imports, syntax errors. These are the bugs that shipped
# unnoticed (a missing import in reader.py, a broken f-string in a model worker).
select = ["F"]
