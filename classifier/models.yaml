# Model registry for `tege classify`. Name is what you pass to `tege classify --model ...`.
#
#   runner    worker from workers/ (d1_worker | pplx_worker)
#   venv      environment where the worker runs (created by ./setup.sh)
#   repo      Hugging Face repository
#   revision  pinned commit. Models load code from the repository
#             (trust_remote_code / source/), so exactly that
#             revision is run, viewable via ./fetch.py --code-only <name>.
#   grouping  joint  — all questions of one group go in a single request (one pass);
#             single — each question as a separate request.
#             pplx-decider-flash recommends single; d1 is tuned for joint.
#             Override: tege classify --grouping single
#   device    auto | cuda | mps | cpu
#   dtype     auto | bf16 | fp16 | fp32
#             d1: auto = bf16 on mps/cuda, fp32 on cpu (as in model card).
#             pplx: auto = fp32 on mps/cpu (as in original code, ~18 GB);
#                   bf16 is twice as efficient, but deviates from original.
models:

  d1-2B:
    runner: d1_worker
    venv: .venv-liquid
    repo: LiquidAI/d1-2B
    revision: 652f920e544ea37f81e4b0ce89b81d4ed0da90b1
    grouping: joint
    device: auto
    dtype: auto

  d1-3B:
    runner: d1_worker
    venv: .venv-liquid
    repo: LiquidAI/d1-3B
    revision: 051bcc464b01b9f92942b364d9586b0ef5912432   # code reviewed
    grouping: joint
    device: auto
    dtype: auto

  pplx-flash:
    runner: pplx_worker
    venv: .venv-pplx
    repo: perplexity-ai/pplx-decider-flash-v1.2
    revision: 9ff7cf9838e59df461c276b7699d56b244d2af58
    grouping: single
    device: auto
    dtype: auto
